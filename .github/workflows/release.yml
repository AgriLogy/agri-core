name: release

# python-semantic-release: reads conventional commits since the last tag,
# computes the next version, rewrites src/agri/core/_version.py, updates
# CHANGELOG.md, tags (bare {version}) and creates a GitHub Release.
# Thin caller — the logic lives in AgriLogy/shared-workflows. The [skip ci]
# guard and the concurrency group stay caller-side by design.

on:
  # Auto-release on every push to main. The release commit semantic-release
  # pushes back carries "[skip ci]", so it does not re-trigger this workflow.
  push:
    branches: [main]
  # Manual fallback (and the only way to cut an rc off a feat/fix/perf branch).
  workflow_dispatch:
    inputs:
      release_type:
        description: "stable (main) or rc (feat|fix|perf branch)"
        type: choice
        options: [stable, rc]
        default: stable

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    uses: AgriLogy/shared-workflows/.github/workflows/release.yml@v1
    with:
      prerelease: ${{ inputs.release_type == 'rc' }}
