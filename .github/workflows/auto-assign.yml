name: Auto Assign

# Assigns newly opened issues and PRs to mks-zakaria.
# Thin caller — the logic lives in AgriLogy/shared-workflows.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  run:
    uses: AgriLogy/shared-workflows/.github/workflows/auto-assign.yml@v1
